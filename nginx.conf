server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip estática y dinámica (H-14)
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        text/css
        text/plain
        text/javascript
        image/svg+xml;

    # Cabeceras de seguridad y Content-Security-Policy (H-13)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Blazor WebAssembly: el enrutamiento es del lado del cliente, toda ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché inmutable para artefactos fingerprint y framework
    location ~* \.(wasm|dll|pdb|dat|blazor\.webassembly.*\.js)$ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # La configuración cambia por despliegue: nunca en caché
    location = /appsettings.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
