server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/mime.types;

    # Compresión gzip estática y dinámica (H-14)
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        text/css
        text/plain
        text/javascript
        image/svg+xml;

    # Cabeceras de seguridad comunes
    include /etc/nginx/conf.d/seguridad.conf;

    # Blazor WebAssembly: el enrutamiento es del lado del cliente, toda ruta desconocida devuelve index.html
    location / {
        include /etc/nginx/conf.d/seguridad.conf;
        try_files $uri $uri/ /index.html;
    }

    # Caché inmutable para artefactos fingerprint y framework
    location ~* \.(wasm|dll|pdb|dat|blazor\.webassembly.*\.js)$ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/seguridad.conf;
    }

    # La configuración cambia por despliegue: nunca en caché
    location = /appsettings.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/conf.d/seguridad.conf;
    }
}
