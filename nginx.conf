server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly: el enrutamiento es del lado del cliente, toda ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La configuración cambia por despliegue: nunca en caché
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }

    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
}
