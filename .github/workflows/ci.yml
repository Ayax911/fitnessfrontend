name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Paquetes con vulnerabilidades conocidas
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then
            echo "::error::Hay paquetes vulnerables (ver el log)"; exit 1
          fi

      - name: Pruebas
        run: dotnet test --no-build -c Release

      - name: La imagen Docker se construye
        run: docker build -t fitnessfrontend:ci .
